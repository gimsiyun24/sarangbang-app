# Netlify 설정 — GitHub 연동 자동 배포
#
#   main 브랜치에 push  →  Netlify 가 이 파일을 읽고 build.sh 실행  →  사이트 갱신
#
# 대시보드에서 따로 건드릴 설정은 없습니다. 빌드를 고치려면 이 파일과 build.sh 만 고치세요.

[build]
  publish = "build/web"
  command = "bash build.sh"

[build.environment]
  # Flutter 버전 — 내 PC 에 깔린 버전과 맞춰두세요 (flutter --version)
  FLUTTER_VERSION = "3.44.8"

  # 푸시 알림 발송용 FIREBASE_SERVICE_ACCOUNT 를 환경변수에 넣으면 Netlify 가 배포 결과물에서
  # 비밀값처럼 생긴 문자열을 찾기 시작합니다. 그 "똑똑한 탐지"는 AIza 로 시작하는 Firebase 웹 API 키
  # (lib/app_config.dart, web/firebase-messaging-sw.js)를 유출로 보고 배포를 막는데,
  # 이 키는 원래 브라우저에 공개되는 값이고 접근 제어는 보안 규칙이 합니다. 그래서 끕니다.
  # 진짜 비밀값인 FIREBASE_SERVICE_ACCOUNT 는 함수에서만 읽고 결과물에 들어가지 않습니다.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# 푸시 알림 발송 함수 (netlify/functions/push.mts). 앱이 새 모임·공지·투표·정산을 올린 뒤 부릅니다.
# firebase-admin 은 한 파일로 묶지 않고 node_modules 에서 그대로 씁니다 — 묶으면 Firestore 가
# 안에서 읽는 설정 파일을 못 찾아 실행 중에 멈추는 경우가 있습니다(애기애타 앱과 같은 설정).
# 패키지는 저장소 맨 위 package.json 에 있고, Netlify 가 빌드 전에 알아서 설치합니다.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# SPA: 새로고침이나 /prayer 같은 주소 직접 입력이 404 나지 않게 전부 index.html 로 넘깁니다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ⚠️ Cross-Origin-Opener-Policy 는 넣지 마세요.
    #    구글 로그인 팝업(signInWithPopup)이 막혀서 로그인이 안 됩니다.
