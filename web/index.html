<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="우리 사랑방의 1년이 남는 곳">

  <!-- 검색엔진 노출 차단 -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사랑방">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>사랑방 나눔</title>
  <meta name="theme-color" content="#ECEDEE">
  <link rel="manifest" href="manifest.json">

  <!-- 어두운 화면: 앱이 뜨기 전에 로딩 화면·폰 상단 색부터 맞춥니다. 안 그러면 어두운 설정인데 첫 화면만 밝게 번쩍입니다.
       열쇠와 판단은 lib/core/display_settings.dart 와 같습니다 (고른 값이 없으면 폰 설정). -->
  <script>
    try {
      var chosen = localStorage.getItem('sarangbang:theme');
      var dark = chosen ? chosen === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121315');
      }
    } catch (e) {}
  </script>

  <!-- Pretendard 는 pubspec 에 번들되어 있습니다 (assets/fonts).
       CDN @font-face 는 CanvasKit 렌더러가 부분적으로만 가져가서
       한글 일부가 □ 로 깨집니다. 그래서 여기서는 불러오지 않습니다. -->

  <!-- 로딩 화면 — 탭 화면과 같은 회색 바탕(lib/theme.dart 의 AppColors.canvas) 가운데에 로고 하나만 둡니다.
       바탕이 같은 색이라 로딩 화면이 걷힐 때 색이 튀지 않습니다.
       로고는 한 번만 부드럽게 떠오릅니다. 계속 움직이면 오히려 오래 기다린 것처럼 느껴집니다. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ECEDEE; }
    #boot {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #ECEDEE; transition: opacity .3s;
    }
    #boot .logo {
      width: 132px; height: auto;
      /* 가운데에서 오른쪽 15px, 위로 12px. 떠오르는 애니메이션이 transform 을 쓰므로 위치는 relative 로 옮깁니다. */
      position: relative; left: 15px; top: -12px;
      animation: splash-in .5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #boot .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @keyframes splash-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { #boot .logo { animation: none } }
    /* 어두운 화면 — lib/theme.dart 의 어두운 canvas */
    html.dark, html.dark body, html.dark #boot { background: #121315; }
  </style>
</head>
<body>
  <div id="boot"><img class="logo" src="splash-logo.png" alt="NewWave"><span class="sr-only">사랑방을 여는 중이에요</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
