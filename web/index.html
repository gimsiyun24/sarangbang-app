<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="우리 사랑방의 1년이 남는 곳">

  <!-- 검색엔진 노출 차단 -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사랑방">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>사랑방 나눔</title>
  <meta name="theme-color" content="#ECEDEE">
  <link rel="manifest" href="manifest.json">

  <!-- Pretendard 는 pubspec 에 번들되어 있습니다 (assets/fonts).
       CDN @font-face 는 CanvasKit 렌더러가 부분적으로만 가져가서
       한글 일부가 □ 로 깨집니다. 그래서 여기서는 불러오지 않습니다. -->

  <!-- 로딩 화면 — 애기애타 앱처럼 흰 바탕 가운데에 로고 하나만 둡니다.
       로고는 한 번만 부드럽게 떠오릅니다. 계속 움직이면 오히려 오래 기다린 것처럼 느껴집니다.
       html·body 바탕은 lib/theme.dart 의 AppColors.canvas 와 맞춥니다 (로딩 화면이 걷힌 뒤 보이는 색). -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ECEDEE; }
    #boot {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #FFFFFF; transition: opacity .3s;
    }
    #boot .logo {
      width: 132px; height: auto;
      /* 가운데에서 오른쪽 10px, 위로 7px. 떠오르는 애니메이션이 transform 을 쓰므로 위치는 relative 로 옮깁니다. */
      position: relative; left: 10px; top: -7px;
      animation: splash-in .5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #boot .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @keyframes splash-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { #boot .logo { animation: none } }
  </style>
</head>
<body>
  <div id="boot"><img class="logo" src="splash-logo.png" alt="NewWave"><span class="sr-only">사랑방을 여는 중이에요</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
