<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="우리 사랑방의 1년이 남는 곳">

  <!-- 검색엔진 노출 차단 -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사랑방">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>사랑방 나눔</title>
  <meta name="theme-color" content="#4CAF82">
  <link rel="manifest" href="manifest.json">

  <!-- Pretendard 는 pubspec 에 번들되어 있습니다 (assets/fonts).
       CDN @font-face 는 CanvasKit 렌더러가 부분적으로만 가져가서
       한글 일부가 □ 로 깨집니다. 그래서 여기서는 불러오지 않습니다. -->

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F6FAF7; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
      color: #4CAF82; background: #F6FAF7; transition: opacity .3s;
    }
    #boot .leaf { font-size: 40px; animation: pulse 1.4s ease-in-out infinite; }
    #boot .txt { font-size: 14px; color: #7A8C82; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .7 } 50% { transform: scale(1.15); opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot"><div class="leaf">🍀</div><div class="txt">사랑방을 여는 중...</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
